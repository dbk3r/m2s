[project]
name = "m2s"
version = "0.1.0"
description = "Phase 1: German singing G2P, phoneme set, and the test/analysis loop."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "numpy>=1.26"]
record = ["PySide6>=6.8", "sounddevice>=0.5", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
